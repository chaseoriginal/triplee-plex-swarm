# triplee-plex-swarm — Plex Media Server ("Triple E Linux Plex") as a Swarm service.
#
# Reconciled 2026-10-25 to mirror the live service spec exactly, so a redeploy
# is a no-op instead of a regression.
#
# Two settings are load-bearing — do not "clean them up":
#
# 1. VERSION=latest
#    Enables the LinuxServer.io runtime update check against Plex channel 8
#    (Plex Pass beta). The alternative values are both wrong:
#      - VERSION=beta   -> the image treats it as a literal version string and
#                          tries to download .../plex-media-server-new/beta/...
#                          which returns HTTP 403, so the update silently fails
#                          and PMS stays on the version baked into the image.
#      - VERSION=docker -> skips the update check entirely and pins PMS to
#                          whatever the image ships (public channel only).
#    With VERSION=latest the container downloads the Plex Pass beta build
#    (1.43.5.11079-b3b13e506) and dpkg-installs it on every start.
#
# 2. NO `user:` directive
#    Non-root mode makes the image skip the runtime update entirely
#    ("Runtime update not supported with read-only or non-root operation").
#    The service must start as root so the s6 init can install the .deb.
#    PUID/PGID below are passed to the image so the Plex process itself still
#    runs as uid/gid 1000.
#
# GPU: the live service has NO swarm generic_resources reservation. The Quadro
# P2000 is injected by the NVIDIA container runtime hook because of
# NVIDIA_VISIBLE_DEVICES=all. Do not add a generic_resources NVIDIA-GPU
# reservation — the swarm has no NVIDIA device plugin configured, so that
# would make the deploy fail to schedule.
#
# Networking is host mode: the external overlay triplee-plex-swarm_default
# does not exist on this swarm, and NPM proxies straight to the host port.
services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    environment:
      - TZ=America/Chicago
      - PUID=1000
      - PGID=1000
      - PLEX_UID=1000
      - PLEX_GID=1000
      - ADVERTISE_IP=https://216.165.142.70:32400
      - VERSION=latest
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=video,compute,utility
    volumes:
      - triplee-plex-swarm_config:/config
      - triplee-plex-swarm_transcode:/transcode
      - /media/Multimedia:/media
      - /media/Multimedia/Music:/music
    network_mode: host
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
      placement:
        constraints:
          - node.hostname==ore-dock-110-4
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: continue
        monitor: 60s
        max_failure_ratio: 0.3

volumes:
  triplee-plex-swarm_config:
    name: triplee-plex-swarm_config
  triplee-plex-swarm_transcode:
    name: triplee-plex-swarm_transcode
