services:
  plex:
    container_name: triplee-plex-swarm_plex
    image: lscr.io/linuxserver/plex:latest
    ports:
    - target: 32400
      published: 32400
      protocol: tcp
      mode: host
    - target: 1900
      published: 1900
      protocol: udp
      mode: host
    - target: 8324
      published: 8324
      protocol: tcp
      mode: host
    - target: 32469
      published: 32469
      protocol: tcp
      mode: host
    - target: 32410
      published: 32410
      protocol: udp
      mode: host
    - target: 32411
      published: 32411
      protocol: udp
      mode: host
    - target: 32412
      published: 32412
      protocol: udp
      mode: host
    - target: 32413
      published: 32413
      protocol: udp
      mode: host
    - target: 32414
      published: 32414
      protocol: udp
      mode: host
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.hostname==ore-dock-110-4
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: continue
        monitor: 60s
        max_failure_ratio: 0.3
    environment:
      TZ: America/Chicago
      PLEX_CLAIM: ${CLAIMTOKEN}
      VERSION: latest
      ADVERTISE_IP: https://216.165.142.70:32400
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: video,compute,utility
      PLEX_UID: 1000
      PLEX_GID: '1000'
      PGID: '1000'
      PUID: '1000'
    hostname: https://lplex.echoinggreen.net
    volumes:
    - triplee-plex-swarm_config:/config
    - triplee-plex-swarm_transcode:/transcode
    - /media/Multimedia:/media
    - /media/Multimedia/Music:/music
volumes:
  triplee-plex-swarm_config:
    name: triplee-plex-swarm_config
  triplee-plex-swarm_transcode:
    name: triplee-plex-swarm_transcode
